name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure x64
        run: cmake -S . -B out/build-x64 -A x64

      - name: Build x64
        run: cmake --build out/build-x64 --config Release

      - name: Test x64
        run: ctest --test-dir out/build-x64 -C Release --output-on-failure

      - name: Configure Win32
        run: cmake -S . -B out/build-x86 -A Win32

      - name: Build Win32
        run: cmake --build out/build-x86 --config Release

      - name: Test Win32
        run: ctest --test-dir out/build-x86 -C Release --output-on-failure

      - name: Package plugin
        shell: pwsh
        run: |
          $package = "dist/wdx_fonttrace-1.0.0"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "out/build-x86/Release/fonttrace.wdx" $package
          Copy-Item "out/build-x64/Release/fonttrace.wdx64" $package
          Copy-Item "pluginst.inf", "README.md", "CHANGELOG.md", `
            "LICENSE.txt" $package
          Compress-Archive -Path "$package/*" `
            -DestinationPath "dist/wdx_fonttrace-1.0.0.zip" `
            -CompressionLevel Optimal

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: wdx_fonttrace-1.0.0
          path: dist/wdx_fonttrace-1.0.0.zip
          if-no-files-found: error
